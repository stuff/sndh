# SNDH radio: scheduler (track picking + API), Liquidsoap (radio engine),
# Icecast (stream distribution) and web (the player page, from ../web).
# Only web:8080 is meant to be reachable from outside: its nginx serves the
# page and proxies /atari-st.opus to Icecast and /api/ to the scheduler, so
# the whole radio lives on one domain. In Coolify, give a domain to web only.
# For local ports, see docker-compose.override.yml.

services:
  scheduler:
    build: ./scheduler
    restart: unless-stopped
    environment:
      RECENT_TRACKS: ${RECENT_TRACKS:-500}
      RECENT_ARTISTS: ${RECENT_ARTISTS:-3}
      RESCAN_INTERVAL_S: ${RESCAN_INTERVAL_S:-0}
      ICECAST_MOUNT: ${ICECAST_MOUNT:-atari-st.opus}
    volumes:
      - ${MUSIC_HOST_DIR:-/srv/sndh/opus_files}:/music:ro
      - scheduler-state:/state
    expose:
      - "3000"

  liquidsoap:
    build: ./liquidsoap
    restart: unless-stopped
    depends_on:
      - scheduler
      - icecast
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?ICECAST_SOURCE_PASSWORD must be set}
      ICECAST_MOUNT: ${ICECAST_MOUNT:-atari-st.opus}
      OPUS_BITRATE: ${OPUS_BITRATE:-64}
      CROSSFADE_S: ${CROSSFADE_S:-3}
      RADIO_NAME: ${RADIO_NAME:-SNDH Radio}
    volumes:
      - ${MUSIC_HOST_DIR:-/srv/sndh/opus_files}:/music:ro

  icecast:
    build: ./icecast
    restart: unless-stopped
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:?ICECAST_ADMIN_PASSWORD must be set}
      ICECAST_HOSTNAME: ${ICECAST_HOSTNAME:-localhost}
      ICECAST_MAX_LISTENERS: ${ICECAST_MAX_LISTENERS:-500}
    expose:
      - "8000"

  web:
    build: ../web
    restart: unless-stopped
    depends_on:
      - icecast
      - scheduler
    expose:
      - "8080"

volumes:
  scheduler-state:
